name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v0.0.2

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-pages
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils binutils curl file jq shellcheck zsh
      - name: Validate release and build packages
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(bin/starlink --version)" = "starlink $(cat VERSION)"
          make lint test packages
          test "$(dpkg-deb -f dist/grpcurl_1.9.4-1_amd64.deb Architecture)" = amd64
          test "$(dpkg-deb -f dist/grpcurl_1.9.4-1_arm64.deb Architecture)" = arm64
          mkdir /tmp/grpcurl-arm64
          dpkg-deb -x dist/grpcurl_1.9.4-1_arm64.deb /tmp/grpcurl-arm64
          readelf -h /tmp/grpcurl-arm64/usr/bin/grpcurl | grep -E 'Machine:.*AArch64'
          sudo apt-get install -y ./dist/grpcurl_1.9.4-1_amd64.deb ./dist/starlink_"$(cat VERSION)"_all.deb
          grpcurl -version 2>&1 | grep -E 'grpcurl v?1[.]9[.]4'
      - name: Import signing key and build APT feed
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          ./scripts/build-apt.sh
          gpg --verify public/InRelease
      - name: Verify the signed feed with APT
        run: |
          state=$(mktemp -d)
          chmod 755 "$state"
          mkdir -p "$state/lists/partial" "$state/download"
          cp -R public "$state/feed"
          chmod -R a+rX "$state/feed"
          gpg --show-keys "$state/feed/starlink.asc"
          printf 'deb [signed-by=%s/feed/starlink.asc] file:%s/feed ./\n' \
            "$state" "$state" > "$state/sources.list"
          options=(-o "Dir::Etc::sourcelist=$state/sources.list" \
            -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$state/lists")
          sudo apt-get "${options[@]}" update
          cd "$state/download"
          sudo apt-get "${options[@]}" download starlink grpcurl
          for package in ./*.deb; do
            dpkg-deb --info "$package"
          done
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum ./*.deb > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.deb SHA256SUMS --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "starlink $RELEASE_TAG" \
            --notes 'List Starlink router clients on macOS, Ubuntu, and Debian. Includes Homebrew installation and a signed APT feed with grpcurl for amd64 and arm64.'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy signed APT feed
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
